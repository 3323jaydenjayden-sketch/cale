<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cale study app - 登入</title>
    
    <!-- 網站 Favicon 圖示 -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/3323jaydenjayden-sketch/cale/refs/heads/main/nobg_image.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 0.3rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 1.8rem;
        }

        .google-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #ffffff;
            color: #1f2937;
            border: none;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 1.5rem;
        }

        .google-btn:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
        }

        .google-btn img {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            color: #64748b;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 0.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 0.85rem;
            background: #38bdf8;
            color: #0b0f19;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #0284c7;
            color: #ffffff;
        }

        .toggle-mode {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .toggle-mode span {
            color: #38bdf8;
            cursor: pointer;
            text-decoration: underline;
            margin-left: 0.3rem;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 1rem;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="brand-title">cale study app</h1>
        <p class="subtitle" id="pageSubTitle">歡迎回來！請選擇登入方式</p>

        <!-- Google 登入按鈕 -->
        <button type="button" class="google-btn" id="googleLoginBtn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Icon">
            使用 Google 帳號登入
        </button>

        <div class="divider">
            <span>或使用一般帳號</span>
        </div>

        <!-- 一般帳密表單 -->
        <form id="authForm">
            <div class="form-group">
                <label for="username">帳號 / Email</label>
                <input type="text" id="username" class="form-control" placeholder="請輸入帳號或 Email" required>
            </div>
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" class="form-control" placeholder="請輸入密碼" required>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">登入</button>
        </form>

        <div class="error-msg" id="errorMsg"></div>

        <div class="toggle-mode" id="toggleText">
            還沒有帳號嗎？<span id="toggleBtn">立即註冊</span>
        </div>
    </div>

    <!-- Firebase 腳本 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword,
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 帶入真實 Firebase 金鑰
        const firebaseConfig = {
            apiKey: "AIzaSyChKI6znPkXg-lAKilYx2ezDmmTUM6_f7s",
            authDomain: "cale-study-app-41b9b.firebaseapp.com",
            projectId: "cale-study-app-41b9b",
            storageBucket: "cale-study-app-41b9b.firebasestorage.app",
            messagingSenderId: "819450732167",
            appId: "1:819450732167:web:a727579df57eb9da33e222",
            measurementId: "G-GP1XCE9W5E"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isLoginMode = true;

        // 監聽登入狀態：一旦成功登入，確保雲端 Firestore 有該使用者的基本成就資料
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userRef = doc(db, "users", user.uid);
                const userSnap = await getDoc(userRef);

                if (!userSnap.exists()) {
                    await setDoc(userRef, {
                        displayName: user.displayName || user.email.split('@')[0],
                        email: user.email,
                        photoURL: user.photoURL || '',
                        level: 1,
                        xp: 0,
                        totalXp: 0,
                        badges: []
                    });
                }
                // 成功登入後跳轉至主頁面
                window.location.href = "dashboard.html";
            }
        });

        // Google 點擊登入
        document.getElementById("googleLoginBtn").addEventListener("click", async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                document.getElementById("errorMsg").innerText = "Google 登入失敗: " + error.message;
            }
        });

        // 切換 登入 / 註冊 模式
        document.getElementById("toggleBtn").addEventListener("click", toggleMode);

        function toggleMode() {
            isLoginMode = !isLoginMode;
            document.getElementById("pageSubTitle").innerText = isLoginMode ? "歡迎回來！請選擇登入方式" : "建立新帳號以開始學習";
            document.getElementById("submitBtn").innerText = isLoginMode ? "登入" : "註冊帳號";
            document.getElementById("toggleText").innerHTML = isLoginMode 
                ? '還沒有帳號嗎？<span id="toggleBtn">立即註冊</span>' 
                : '已有帳號？<span id="toggleBtn">返回登入</span>';
            document.getElementById("errorMsg").innerText = "";

            document.getElementById("toggleBtn").addEventListener("click", toggleMode);
        }

        // 一般帳密送出處理
        document.getElementById("authForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const inputUser = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            const email = inputUser.includes("@") ? inputUser : `${inputUser}@caleapp.com`;

            errorMsg.innerText = "處理中...";

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, pass);
                } else {
                    await createUserWithEmailAndPassword(auth, email, pass);
                }
            } catch (error) {
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMsg.innerText = "帳號或密碼錯誤！";
                } else if (error.code === 'auth/email-already-in-use') {
                    errorMsg.innerText = "該帳號已被註冊！";
                } else if (error.code === 'auth/weak-password') {
                    errorMsg.innerText = "密碼長度至少需要 6 個字元！";
                } else {
                    errorMsg.innerText = "登入失敗：" + error.message;
                }
            }
        });
    </script>
</body>
</html>
