<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cale Study App - 萬聖節登入 🎃</title>
    
    <!-- 網站 Favicon 圖示 -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/3323jaydenjayden-sketch/cale/refs/heads/main/image.png">

    <!-- 引入 Google 官方 SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        }

        body {
            background-color: #0d0914; /* 萬聖節幽暗夜空紫 */
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .spooky-float {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.12;
            pointer-events: none;
            user-select: none;
            animation: floatAnim 10s infinite ease-in-out alternate;
            z-index: 0;
        }

        @keyframes floatAnim {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(12deg); }
            100% { transform: translateY(10px) rotate(-12deg); }
        }

        .login-card {
            background: rgba(28, 19, 43, 0.75);
            border: 1px solid rgba(255, 117, 24, 0.3);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 10;
            position: relative;
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 700;
            color: #ff7518; /* 南瓜橘 */
            margin-bottom: 0.3rem;
            letter-spacing: -0.5px;
            text-shadow: 0 0 10px rgba(255, 117, 24, 0.3);
        }

        .subtitle {
            font-size: 0.9rem;
            color: #a799be;
            margin-bottom: 1.8rem;
        }

        /* Google 登入按鈕容器 */
        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
            min-height: 44px;
        }

        .divider {
            display: flex;
            align-items: center;
            color: #7c6899;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 117, 24, 0.2);
        }

        .divider span {
            padding: 0 0.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #d1c4e9;
            margin-bottom: 0.4rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(13, 9, 20, 0.85);
            border: 1px solid rgba(255, 117, 24, 0.25);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #ff7518;
            box-shadow: 0 0 10px rgba(255, 117, 24, 0.3);
        }

        .btn-primary {
            width: 100%;
            padding: 0.85rem;
            background: #ff7518;
            color: #0d0914;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 117, 24, 0.3);
        }

        .btn-primary:hover {
            background: #e6640e;
            color: #ffffff;
        }

        .toggle-mode {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #a799be;
        }

        .toggle-mode span {
            color: #ff7518;
            cursor: pointer;
            text-decoration: underline;
            margin-left: 0.3rem;
        }

        .error-msg {
            color: #ff4757;
            font-size: 0.85rem;
            margin-top: 1rem;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>

    <!-- 萬聖節飄浮裝飾 🎃👻🦇 -->
    <div class="spooky-float" style="top: 10%; left: 10%;">🎃</div>
    <div class="spooky-float" style="top: 80%; left: 88%; animation-delay: -3s;">👻</div>
    <div class="spooky-float" style="top: 30%; right: 8%; animation-delay: -5s;">🦇</div>

    <div class="login-card">
        <h1 class="brand-title">Cale Study 🎃</h1>
        <p class="subtitle" id="pageSubTitle">歡迎來到萬聖節魔法學院！請選擇登入方式</p>

        <!-- 1. Google 快捷登入區域 -->
        <div class="google-btn-wrapper">
            <div id="g_id_onload"
                data-client_id="48507491429-i6c5cac9cr358iqbp8sv0mv3h67h051t.apps.googleusercontent.com"
                data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                data-type="standard"
                data-size="large"
                data-theme="filled_black"
                data-text="sign_in_with"
                data-shape="rectangular"
                data-logo_alignment="left">
            </div>
        </div>

        <div class="divider">
            <span>或使用萬聖魔法帳號</span>
        </div>

        <!-- 2. 一般帳密登入表單 -->
        <form id="authForm">
            <div class="form-group">
                <label for="username">魔法帳號</label>
                <input type="text" id="username" class="form-control" placeholder="請輸入帳號" required>
            </div>
            <div class="form-group">
                <label for="password">安全咒語 (密碼)</label>
                <input type="password" id="password" class="form-control" placeholder="請輸入密碼" required>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">進入魔法世界 🎃</button>
        </form>

        <div class="error-msg" id="errorMsg"></div>

        <div class="toggle-mode" id="toggleText">
            還沒有魔法帳號嗎？<span onclick="toggleMode()">立即註冊</span>
        </div>
    </div>

    <!-- 載入 Firebase 模組 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChKI6znPkXg-lAKilYx2ezDmmTUM6_f7s",
            authDomain: "cale-study-app-41b9b.firebaseapp.com",
            projectId: "cale-study-app-41b9b",
            storageBucket: "cale-study-app-41b9b.firebasestorage.app",
            messagingSenderId: "819450732167",
            appId: "1:819450732167:web:a727579df57eb9da33e222",
            measurementId: "G-GP1XCE9W5E"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        function getSafeDocId(key) {
            return key.replace(/[^a-zA-Z0-9_-]/g, "_");
        }

        window.isLoginMode = true;

        if (localStorage.getItem("isLoggedIn") === "true") {
            window.location.href = "Halloween dashboard.html";
        }

        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        window.handleCredentialResponse = async function(response) {
            const responsePayload = parseJwt(response.credential);
            const userEmail = responsePayload.email;

            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("currentUser", responsePayload.name);
            localStorage.setItem("userPicture", responsePayload.picture);
            localStorage.setItem("userEmail", userEmail);
            localStorage.setItem("accountKey", userEmail);

            const safeDocId = getSafeDocId(userEmail);
            const userRef = doc(db, "users", safeDocId);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    displayName: responsePayload.name,
                    accountKey: userEmail,
                    level: 1,
                    xp: 0,
                    totalXp: 0,
                    badges: []
                });
            }

            window.location.href = "dashboard.html";
        };

        window.toggleMode = function() {
            window.isLoginMode = !window.isLoginMode;
            document.getElementById("pageSubTitle").innerText = window.isLoginMode ? "歡迎來到萬聖節魔法學院！請選擇登入方式" : "建立新帳號以開始萬聖學習";
            document.getElementById("submitBtn").innerText = window.isLoginMode ? "進入魔法世界 🎃" : "註冊魔法帳號 🍬";
            document.getElementById("toggleText").innerHTML = window.isLoginMode 
                ? '還沒有魔法帳號嗎？<span onclick="toggleMode()">立即註冊</span>' 
                : '已有帳號？<span onclick="toggleMode()">返回登入</span>';
            document.getElementById("errorMsg").innerText = "";
        };

        document.getElementById("authForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("errorMsg");
            const submitBtn = document.getElementById("submitBtn");

            if (!user || !pass) {
                errorMsg.innerText = "請填寫所有欄位！";
                return;
            }

            const safeDocId = getSafeDocId(user);
            const userRef = doc(db, "users", safeDocId);

            submitBtn.disabled = true;
            submitBtn.innerText = "魔法連線中...";

            try {
                const userSnap = await getDoc(userRef);

                if (window.isLoginMode) {
                    if (userSnap.exists()) {
                        const userData = userSnap.data();
                        
                        if (userData.password === pass) {
                            localStorage.setItem("isLoggedIn", "true");
                            localStorage.setItem("currentUser", user);
                            localStorage.setItem("accountKey", user);
                            localStorage.setItem("xp_" + user, userData.xp || 0);
                            localStorage.removeItem("userPicture");
                            localStorage.removeItem("userEmail");

                            window.location.href = "dashboard.html";
                        } else {
                            errorMsg.innerText = "安全咒語 (密碼) 錯誤！";
                        }
                    } else {
                        if (user === "cale" && pass === "123456") {
                            localStorage.setItem("isLoggedIn", "true");
                            localStorage.setItem("currentUser", user);
                            localStorage.setItem("accountKey", user);
                            window.location.href = "dashboard.html";
                        } else {
                            errorMsg.innerText = "帳號不存在！請點選下方註冊。";
                        }
                    }
                } else {
                    if (userSnap.exists()) {
                        errorMsg.innerText = "該帳號已被其他人註冊！";
                    } else {
                        await setDoc(userRef, {
                            displayName: user,
                            accountKey: user,
                            password: pass,
                            level: 1,
                            xp: 0,
                            totalXp: 0,
                            badges: [],
                            createdAt: new Date().toISOString()
                        });

                        localStorage.setItem("isLoggedIn", "true");
                        localStorage.setItem("currentUser", user);
                        localStorage.setItem("accountKey", user);
                        localStorage.removeItem("userPicture");
                        localStorage.removeItem("userEmail");

                        alert("註冊成功！已同步至雲端並自動登入 🎃");
                        window.location.href = "dashboard.html";
                    }
                }
            } catch (err) {
                console.error("驗證失敗：", err);
                errorMsg.innerText = "連線失敗，請檢查網路連線。";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = window.isLoginMode ? "進入魔法世界 🎃" : "註冊魔法帳號 🍬";
            }
        });
    </script>
</body>
</html>
