<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cale study app - 登入</title>
    
    <!-- 網站 Favicon 圖示 -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/3323jaydenjayden-sketch/cale/refs/heads/main/nobg_image.png">

    <!-- 引入 Google 官方 SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .brand-title {
            font-size: 2rem;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 0.3rem;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 1.8rem;
        }

        /* Google 登入按鈕容器 */
        .google-btn-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
            min-height: 44px;
        }

        .divider {
            display: flex;
            align-items: center;
            color: #64748b;
            font-size: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 0.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 0.4rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        .btn-primary {
            width: 100%;
            padding: 0.85rem;
            background: #38bdf8;
            color: #0b0f19;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background: #0284c7;
            color: #ffffff;
        }

        .toggle-mode {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .toggle-mode span {
            color: #38bdf8;
            cursor: pointer;
            text-decoration: underline;
            margin-left: 0.3rem;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 1rem;
            min-height: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1 class="brand-title">cale study app</h1>
        <p class="subtitle" id="pageSubTitle">歡迎回來！請選擇登入方式</p>

        <!-- 1. Google 快捷登入區域 -->
        <div class="google-btn-wrapper">
            <div id="g_id_onload"
                data-client_id="48507491429-i6c5cac9cr358iqbp8sv0mv3h67h051t.apps.googleusercontent.com"
                data-callback="handleCredentialResponse"
                data-auto_prompt="false">
            </div>
            <div class="g_id_signin"
                data-type="standard"
                data-size="large"
                data-theme="filled_black"
                data-text="sign_in_with"
                data-shape="rectangular"
                data-logo_alignment="left">
            </div>
        </div>

        <div class="divider">
            <span>或使用一般帳號</span>
        </div>

        <!-- 2. 一般帳密登入表單 -->
        <form id="authForm">
            <div class="form-group">
                <label for="username">帳號</label>
                <input type="text" id="username" class="form-control" placeholder="請輸入帳號" required>
            </div>
            <div class="form-group">
                <label for="password">密碼</label>
                <input type="password" id="password" class="form-control" placeholder="請輸入密碼" required>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">登入</button>
        </form>

        <div class="error-msg" id="errorMsg"></div>

        <div class="toggle-mode" id="toggleText">
            還沒有帳號嗎？<span onclick="toggleMode()">立即註冊</span>
        </div>
    </div>

    <!-- 載入 Firebase 模組 (App, Analytics, Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChKI6znPkXg-lAKilYx2ezDmmTUM6_f7s",
            authDomain: "cale-study-app-41b9b.firebaseapp.com",
            projectId: "cale-study-app-41b9b",
            storageBucket: "cale-study-app-41b9b.firebasestorage.app",
            messagingSenderId: "819450732167",
            appId: "1:819450732167:web:a727579df57eb9da33e222",
            measurementId: "G-GP1XCE9W5E"
        };

        // 初始化 Firebase 服務
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // 將文件識別碼清理成安全的格式
        function getSafeDocId(key) {
            return key.replace(/[^a-zA-Z0-9_-]/g, "_");
        }

        window.isLoginMode = true;

        // 若已經登入，自動前往 dashboard
        if (localStorage.getItem("isLoggedIn") === "true") {
            window.location.href = "dashboard.html";
        }

        // 解析 Google 回傳的 JWT Token 資訊
        function parseJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Google 登入成功後的回調函數
        window.handleCredentialResponse = async function(response) {
            const responsePayload = parseJwt(response.credential);
            const userEmail = responsePayload.email;

            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("currentUser", responsePayload.name);
            localStorage.setItem("userPicture", responsePayload.picture);
            localStorage.setItem("userEmail", userEmail);
            localStorage.setItem("accountKey", userEmail);

            // 雲端記錄 Google 登入資訊
            const safeDocId = getSafeDocId(userEmail);
            const userRef = doc(db, "users", safeDocId);
            const userSnap = await getDoc(userRef);

            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    displayName: responsePayload.name,
                    accountKey: userEmail,
                    level: 1,
                    xp: 0,
                    totalXp: 0,
                    badges: []
                });
            }

            window.location.href = "dashboard.html";
        };

        window.toggleMode = function() {
            window.isLoginMode = !window.isLoginMode;
            document.getElementById("pageSubTitle").innerText = window.isLoginMode ? "歡迎回來！請選擇登入方式" : "建立新帳號以開始學習";
            document.getElementById("submitBtn").innerText = window.isLoginMode ? "登入" : "註冊帳號";
            document.getElementById("toggleText").innerHTML = window.isLoginMode 
                ? '還沒有帳號嗎？<span onclick="toggleMode()">立即註冊</span>' 
                : '已有帳號？<span onclick="toggleMode()">返回登入</span>';
            document.getElementById("errorMsg").innerText = "";
        };

        document.getElementById("authForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const user = document.getElementById("username").value.trim();
            const pass = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("errorMsg");
            const submitBtn = document.getElementById("submitBtn");

            if (!user || !pass) {
                errorMsg.innerText = "請填寫所有欄位！";
                return;
            }

            const safeDocId = getSafeDocId(user);
            const userRef = doc(db, "users", safeDocId);

            submitBtn.disabled = true;
            submitBtn.innerText = "連線驗證中...";

            try {
                const userSnap = await getDoc(userRef);

                if (window.isLoginMode) {
                    // === 雲端登入驗證 ===
                    if (userSnap.exists()) {
                        const userData = userSnap.data();
                        
                        // 比對 Firebase 雲端上的密碼
                        if (userData.password === pass) {
                            localStorage.setItem("isLoggedIn", "true");
                            localStorage.setItem("currentUser", user);
                            localStorage.setItem("accountKey", user);
                            localStorage.setItem("xp_" + user, userData.xp || 0);
                            localStorage.removeItem("userPicture");
                            localStorage.removeItem("userEmail");

                            window.location.href = "dashboard.html";
                        } else {
                            errorMsg.innerText = "密碼錯誤！";
                        }
                    } else {
                        // 相容預設測試帳號 cale
                        if (user === "cale" && pass === "123456") {
                            localStorage.setItem("isLoggedIn", "true");
                            localStorage.setItem("currentUser", user);
                            localStorage.setItem("accountKey", user);
                            window.location.href = "dashboard.html";
                        } else {
                            errorMsg.innerText = "帳號不存在！請點選下方註冊。";
                        }
                    }
                } else {
                    // === 雲端註冊 ===
                    if (userSnap.exists()) {
                        errorMsg.innerText = "該帳號已被註冊！";
                    } else {
                        // 正式將新帳號與密碼寫入 Firebase Firestore
                        await setDoc(userRef, {
                            displayName: user,
                            accountKey: user,
                            password: pass, // 儲存至雲端，達成跨裝置同步登入
                            level: 1,
                            xp: 0,
                            totalXp: 0,
                            badges: [],
                            createdAt: new Date().toISOString()
                        });

                        localStorage.setItem("isLoggedIn", "true");
                        localStorage.setItem("currentUser", user);
                        localStorage.setItem("accountKey", user);
                        localStorage.removeItem("userPicture");
                        localStorage.removeItem("userEmail");

                        alert("註冊成功！已同步至雲端並自動登入");
                        window.location.href = "dashboard.html";
                    }
                }
            } catch (err) {
                console.error("驗證失敗：", err);
                errorMsg.innerText = "連線失敗，請檢查網路連線。";
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = window.isLoginMode ? "登入" : "註冊帳號";
            }
        });
    </script>
</body>
</html>
