<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study App - 英文單字庫與練習</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-bar {
            width: 100%;
            max-width: 650px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .back-btn {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.95rem;
        }

        /* 模式切換頁籤 (Tabs) */
        .mode-tabs {
            width: 100%;
            max-width: 650px;
            display: flex;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            flex: 1;
            padding: 0.6rem;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #38bdf8;
            color: #0b0f19;
        }

        .theme-selector-group {
            width: 100%;
            max-width: 650px;
            display: flex;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        select, button.btn-secondary {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 0.6rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        select {
            flex: 1;
            cursor: pointer;
        }

        button.btn-secondary {
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button.btn-secondary:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        /* 容器通用樣式 */
        .container-box {
            width: 100%;
            max-width: 500px;
        }

        .flashcard {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .word-title {
            font-size: 2.5rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.4rem;
        }

        .phonetic {
            font-size: 1rem;
            color: #38bdf8;
            margin-bottom: 1.2rem;
        }

        .meaning {
            font-size: 1.2rem;
            color: #e2e8f0;
            display: none;
        }

        .example-sentence {
            font-size: 0.88rem;
            color: #94a3b8;
            margin-top: 0.8rem;
            font-style: italic;
            display: none;
        }

        .controls {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            gap: 1rem;
        }

        .action-btn {
            flex: 1;
            padding: 0.8rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .action-btn.primary {
            background: #38bdf8;
            color: #0b0f19;
            font-weight: 600;
            border: none;
        }

        /* 練習測驗 UI 樣式 */
        .quiz-option-btn {
            width: 100%;
            padding: 0.9rem;
            margin-top: 0.6rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .quiz-option-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        .quiz-feedback {
            margin-top: 1rem;
            font-weight: bold;
            min-height: 1.5rem;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 1.8rem;
            border-radius: 20px;
            width: 90%;
            max-width: 500px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            padding: 0.8rem;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            resize: none;
        }

        .progress-text {
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="dashboard.html" class="back-btn">⇠ 返回科目</a>
        <div class="progress-text" id="progressText">進度：0 / 0</div>
    </div>

    <!-- 模式切換：字卡模式 vs 練習模式 -->
    <div class="mode-tabs">
        <button class="tab-btn active" id="cardTab" onclick="switchMode('card')">📇 字卡學習</button>
        <button class="tab-btn" id="quizTab" onclick="switchMode('quiz')">✏️ 選擇題練習</button>
    </div>

    <!-- 主題選擇與自訂按鈕 -->
    <div class="theme-selector-group">
    <div class="custom-dropdown" id="themeDropdown">
        <div class="dropdown-selected" onclick="toggleDropdown()">
            <span id="selectedOptionText">📘 會考核心單字 (A 開頭)</span>
            <span class="arrow">▾</span>
        </div>
        <div class="dropdown-menu" id="dropdownMenu">
            <div class="dropdown-item active" onclick="selectTheme('cap_a', '📘 會考核心單字 (A 開頭)')">
                📘 會考核心單字 (A 開頭)
            </div>
            <!-- 未來新增其它字母直接在這邊加項目 -->
            <!-- <div class="dropdown-item" onclick="selectTheme('cap_b', '📘 會考核心單字 (B 開頭)')">📘 會考核心單字 (B 開頭)</div> -->
            <div class="dropdown-item" onclick="selectTheme('custom', '✏️ 個人自訂單字庫')">
                ✏️ 個人自訂單字庫
            </div>
        </div>
    </div>
    <button class="btn-secondary" onclick="openCustomModal()">+ 新增個人單字</button>
</div>
    <!-- 1. 字卡模式區塊 -->
    <div id="cardView" class="container-box">
        <div class="flashcard" onclick="toggleFlip()">
            <div class="word-title" id="wordText">---</div>
            <div class="phonetic" id="phoneticText">---</div>
            <div class="meaning" id="meaningText">---</div>
            <div class="example-sentence" id="exampleText">---</div>
        </div>
        <div class="controls">
            <button class="action-btn" onclick="prevWord()">上一單字</button>
            <button class="action-btn primary" onclick="nextWord()">下一單字 ➔</button>
        </div>
    </div>

    <!-- 2. 練習測驗模式區塊 -->
    <div id="quizView" class="container-box" style="display: none;">
        <div class="flashcard" style="cursor: default;">
            <div style="font-size: 0.9rem; color: #38bdf8; margin-bottom: 0.5rem;">請選擇正確的英文單字：</div>
            <div class="word-title" id="quizQuestion" style="font-size: 1.8rem;">---</div>
            <div id="quizOptions" style="width: 100%; margin-top: 1rem;"></div>
            <div class="quiz-feedback" id="quizFeedback"></div>
        </div>
        <div class="controls">
            <button class="action-btn primary" onclick="generateQuizQuestion()">下一題 ➔</button>
        </div>
    </div>

    <!-- 自訂單字彈窗 Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-content">
            <h3>✏️ 新增個人自訂單字</h3>
            <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 0.5rem;">
                格式：單字,音標,中文解釋,例句（每行一組）
            </p>
            <textarea id="customInput" placeholder="apple,/ˈæp.əl/,n. 蘋果,An apple a day keeps the doctor away."></textarea>
            <div style="display: flex; gap: 0.5rem; justify-content: flex-end;">
                <button class="action-btn" onclick="closeCustomModal()">取消</button>
                <button class="action-btn primary" onclick="saveCustomWords()">儲存單字庫</button>
            </div>
        </div>
    </div>

    <!-- 依序引入 words/ 資料夾中的 JS 單字檔 -->
    <script src="words/word-a.js"></script>

    <script>
        let currentList = [];
        let currentIndex = 0;
        let isFlipped = false;
        let currentMode = 'card';
        let correctQuizAnswer = '';

        // 模式切換 (字卡 / 練習)
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById("cardTab").classList.toggle("active", mode === 'card');
            document.getElementById("quizTab").classList.toggle("active", mode === 'quiz');

            if (mode === 'card') {
                document.getElementById("cardView").style.display = "block";
                document.getElementById("quizView").style.display = "none";
                loadWord();
            } else {
                document.getElementById("cardView").style.display = "none";
                document.getElementById("quizView").style.display = "block";
                generateQuizQuestion();
            }
        }

        function changeTheme() {
            const selected = document.getElementById("themeSelect").value;
            if (selected === "custom") {
                const saved = localStorage.getItem("myCustomVocab");
                currentList = saved ? JSON.parse(saved) : [];
                if (currentList.length === 0) {
                    alert("目前還沒有個人自訂單字，可以點擊『新增個人單字』來添加！");
                    openCustomModal();
                }
            } else {
                currentList = (window.builtInThemes && window.builtInThemes[selected]) || [];
            }
            currentIndex = 0;
            if (currentMode === 'card') {
                loadWord();
            } else {
                generateQuizQuestion();
            }
        }

        // 字卡邏輯
        function loadWord() {
            if (currentList.length === 0) {
                document.getElementById("wordText").innerText = "尚無單字";
                document.getElementById("phoneticText").innerText = "";
                document.getElementById("meaningText").innerText = "";
                document.getElementById("exampleText").innerText = "";
                document.getElementById("progressText").innerText = "進度：0 / 0";
                return;
            }

            const item = currentList[currentIndex];
            document.getElementById("wordText").innerText = item.word;
            document.getElementById("phoneticText").innerText = item.phonetic || "";
            document.getElementById("meaningText").innerText = item.meaning || "";
            document.getElementById("exampleText").innerText = item.example || "";
            document.getElementById("progressText").innerText = `進度：${currentIndex + 1} / ${currentList.length}`;

            isFlipped = false;
            document.getElementById("meaningText").style.display = "none";
            document.getElementById("exampleText").style.display = "none";
        }

        function toggleFlip() {
            if (currentList.length === 0) return;
            isFlipped = !isFlipped;
            const displayStyle = isFlipped ? "block" : "none";
            document.getElementById("meaningText").style.display = displayStyle;
            document.getElementById("exampleText").style.display = displayStyle;
        }

        function nextWord() {
            if (currentIndex < currentList.length - 1) {
                currentIndex++;
                loadWord();
            } else if (currentList.length > 0) {
                alert("已完成此主題所有單字！");
            }
        }

        function prevWord() {
            if (currentIndex > 0) {
                currentIndex--;
                loadWord();
            }
        }

        // 選擇題練習邏輯
        function generateQuizQuestion() {
            document.getElementById("quizFeedback").innerText = "";
            if (currentList.length < 4) {
                document.getElementById("quizQuestion").innerText = "單字數量過少（至少需 4 個單字才能開始練習）";
                document.getElementById("quizOptions").innerHTML = "";
                return;
            }

            // 隨機選一個作為正確答案
            const correctIndex = Math.floor(Math.random() * currentList.length);
            const target = currentList[correctIndex];
            correctQuizAnswer = target.word;

            document.getElementById("quizQuestion").innerText = target.meaning;

            // 隨機挑選 3 個干擾項
            let options = [target.word];
            while (options.length < 4) {
                const randomWord = currentList[Math.floor(Math.random() * currentList.length)].word;
                if (!options.includes(randomWord)) {
                    options.push(randomWord);
                }
            }

            // 打亂選項順序
            options.sort(() => Math.random() - 0.5);

            // 渲染選項按鈕
            const optionsContainer = document.getElementById("quizOptions");
            optionsContainer.innerHTML = "";
            options.forEach((opt, idx) => {
                const btn = document.createElement("button");
                btn.className = "quiz-option-btn";
                btn.innerText = `${String.fromCharCode(65 + idx)}. ${opt}`;
                btn.onclick = () => checkQuizAnswer(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function checkQuizAnswer(selectedWord) {
            const feedback = document.getElementById("quizFeedback");
            if (selectedWord === correctQuizAnswer) {
                feedback.style.color = "#4ade80";
                feedback.innerText = "🎉 答對了！太棒了！";
            } else {
                feedback.style.color = "#f87171";
                feedback.innerText = `❌ 答錯囉！正確答案是：${correctQuizAnswer}`;
            }
        }

        // 自訂單字彈窗
        function openCustomModal() {
            document.getElementById("customModal").style.display = "flex";
            const saved = localStorage.getItem("myCustomVocabText");
            if (saved) {
                document.getElementById("customInput").value = saved;
            }
        }

        function closeCustomModal() {
            document.getElementById("customModal").style.display = "none";
        }

        function saveCustomWords() {
            const rawText = document.getElementById("customInput").value.trim();
            if (!rawText) {
                alert("內容不能為空！");
                return;
            }

            const lines = rawText.split("\n");
            const parsedList = lines.map(line => {
                const parts = line.split(",");
                return {
                    word: parts[0]?.trim() || "",
                    phonetic: parts[1]?.trim() || "",
                    meaning: parts[2]?.trim() || "",
                    example: parts[3]?.trim() || ""
                };
            }).filter(item => item.word !== "");

            localStorage.setItem("myCustomVocabText", rawText);
            localStorage.setItem("myCustomVocab", JSON.stringify(parsedList));

            alert(`成功新增 ${parsedList.length} 個自訂單字！`);
            closeCustomModal();

            document.getElementById("themeSelect").value = "custom";
            changeTheme();
        }

        // 初始化
        changeTheme();
    </script>
</body>
</html>
