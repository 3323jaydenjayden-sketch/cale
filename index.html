<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study App</title>
    <!-- 載入 Apple 風高質感手寫字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .hello-wrapper {
            position: relative;
            display: inline-block;
        }

        /* 手寫美化字體樣式 */
        .handwritten-text {
            font-family: 'Caveat', cursive;
            font-size: 6rem;
            color: transparent;
            background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
            -webkit-background-clip: text;
            filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.4));
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #38bdf8; /* 光標 */
            width: 0;
            animation: 
                write 2.5s steps(30, end) infinite alternate,
                blink 0.75s step-end infinite;
        }

        /* 書寫動畫：逐漸展開字體 */
        @keyframes write {
            0% { width: 0; }
            70%, 100% { width: 100%; }
        }

        /* 光標閃爍 */
        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #38bdf8; }
        }

        .bottom-hint {
            position: absolute;
            bottom: 50px;
            font-size: 0.95rem;
            color: #64748b;
            letter-spacing: 1px;
            animation: breathe 2.5s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 0.9; transform: translateY(-4px); }
        }
    </style>
</head>
<body onclick="enterApp()">

    <div class="hello-wrapper">
        <div class="handwritten-text">Hello.</div>
    </div>

    <div class="bottom-hint">點擊畫面任意處進入 ➔</div>

    <script>
        function enterApp() {
            alert("進入主畫面！（下一步我們來做『科目選擇』與『主題單字庫』）");
        }
    </script>
</body>
</html>
