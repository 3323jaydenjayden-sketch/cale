<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study App</title>
    <!-- 載入 Apple 風格美化字型 -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Noto+Sans+TC:wght@300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }

        .welcome-box {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 120px;
        }

        /* 正確美觀的文字樣式 */
        .handwritten-text {
            font-size: 5rem;
            font-weight: 300;
            color: transparent;
            background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
            -webkit-background-clip: text;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #38bdf8;
            width: 0;
            transition: width 0.05s linear;
        }

        .bottom-hint {
            position: absolute;
            bottom: 50px;
            font-size: 0.95rem;
            color: #64748b;
            letter-spacing: 1px;
            animation: breathe 2.5s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 0.9; transform: translateY(-4px); }
        }
    </style>
</head>
<body onclick="enterApp()">

    <div class="welcome-box">
        <div class="handwritten-text" id="text">Hello.</div>
    </div>

    <div class="bottom-hint">點擊畫面任意處進入 ➔</div>

    <script>
        // 設定要播放的語言文字與字型
        const list = [
            { text: "Hello.", font: "'Caveat', cursive" },
            { text: "你好.", font: "'Noto Sans TC', sans-serif" },
            { text: "Bonjour.", font: "'Caveat', cursive" },
            { text: "Hola.", font: "'Caveat', cursive" }
        ];

        let index = 0;
        const textEl = document.getElementById("text");

        function drawText() {
            const current = list[index];
            textEl.style.fontFamily = current.font;
            textEl.innerText = current.text;
            
            let width = 0;
            textEl.style.width = "0px";

            // 滑順模擬書寫展開
            const timer = setInterval(() => {
                width += 8;
                textEl.style.width = width + "px";

                if (width >= 280) {
                    clearInterval(timer);
                    // 停留後切換下一個語言
                    setTimeout(() => {
                        index = (index + 1) % list.length;
                        drawText();
                    }, 1800);
                }
            }, 30);
        }

        drawText();

        function enterApp() {
            alert("進入主畫面！（下一步我們來做『科目選擇』與『主題單字庫』）");
        }
    </script>
</body>
</html>
