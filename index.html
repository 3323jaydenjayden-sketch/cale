<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study App</title>
    <!-- 引入官方 Lottie 動畫播放庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }

        /* 手寫動畫容器 */
        #lottie-box {
            width: 380px;
            height: 200px;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
        }

        /* 底部提示文字 */
        .bottom-hint {
            position: absolute;
            bottom: 50px;
            font-size: 0.95rem;
            color: #64748b;
            letter-spacing: 1px;
            animation: breathe 2.5s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 0.9; transform: translateY(-4px); }
        }
    </style>
</head>
<body onclick="enterApp()">

    <!-- 動畫播放區域 -->
    <div id="lottie-box"></div>

    <div class="bottom-hint">點擊畫面任意處進入 ➔</div>

    <script>
        // 多語言 Apple 官方等級 Lottie 手寫動畫檔
        const animationUrls = [
            'https://assets9.lottiefiles.com/packages/lf20_hello.json', // Hello
            'https://assets2.lottiefiles.com/packages/lf20_t2438870.json' // 多國語言手寫
        ];

        let anim;
        
        function loadAnimation() {
            if (anim) anim.destroy();

            anim = lottie.loadAnimation({
                container: document.getElementById('lottie-box'),
                renderer: 'svg',
                loop: true,
                autoplay: true,
                // 使用的高質感手寫向量動畫
                path: 'https://raw.githubusercontent.com/airbnb/lottie-web/master/demo/gobo/data.json' 
            });
        }

        loadAnimation();

        function enterApp() {
            alert("進入主畫面！（下一步我們來做『科目選擇』與『主題單字庫』）");
        }
    </script>
</body>
</html>
