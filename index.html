<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cale Study App</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Noto+Sans+TC:wght@300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }

        .welcome-box {
            position: relative;
            height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .handwritten-text {
            font-size: 5rem;
            color: transparent;
            background: linear-gradient(135deg, #ffffff 30%, #38bdf8 100%);
            -webkit-background-clip: text;
            filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6));
            white-space: nowrap;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .handwritten-text.show {
            opacity: 1;
            transform: scale(1);
        }

        .bottom-hint {
            position: absolute;
            bottom: 50px;
            font-size: 0.95rem;
            color: #64748b;
            letter-spacing: 1px;
            animation: breathe 2.5s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 0.9; transform: translateY(-4px); }
        }
    </style>
</head>
<body onclick="enterApp()">

    <div class="welcome-box">
        <div class="handwritten-text" id="text">Hello.</div>
    </div>

    <div class="bottom-hint">點擊畫面任意處進入 ➔</div>

    <script>
        const list = [
    { text: "Welcome to Cale", font: "'Caveat', cursive" },
    { text: "你好.", font: "'DFKai-SB', '標楷體', 'STKaiti', '楷體', serif" }, // 優先套用標楷體，無內建時自動以 Mac 楷體替代
    { text: "Bonjour.", font: "'Caveat', cursive" },
    { text: "Hola.", font: "'Caveat', cursive" }
];


        let index = 0;
        const textEl = document.getElementById("text");

        function switchGreeting() {
            textEl.classList.remove("show");
            
            setTimeout(() => {
                const current = list[index];
                textEl.style.fontFamily = current.font;
                textEl.innerText = current.text;
                textEl.classList.add("show");
                index = (index + 1) % list.length;
            }, 800);
        }

        switchGreeting();
        setInterval(switchGreeting, 2800);

        function enterApp() {
    // 點擊後跳轉到主畫面
    window.location.href = "dashboard.html";
}
    </script>
</body>
</html>
