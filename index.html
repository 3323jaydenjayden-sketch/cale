<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cale Study App</title>
    <!-- 網站 Favicon 圖示 -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/3323jaydenjayden-sketch/cale/refs/heads/main/image.png">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Noto+Sans+TC:wght@300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }

        .welcome-box {
            position: relative;
            min-height: 200px; /* 給予足夠高度，防止上下被切 */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .handwritten-text {
            font-size: 5rem;
            color: #38bdf8; /* 明亮的霓虹藍色 */
            /* 使用多層文字陰影營造高質感發光效果，且完全不會裁切字母尾巴 */
            text-shadow: 
                0 0 10px rgba(56, 189, 248, 0.8),
                0 0 25px rgba(56, 189, 248, 0.5),
                0 0 50px rgba(56, 189, 248, 0.3);
            
            line-height: 1.6; /* 大幅拉高行高，完整保留 y, p 的下垂筆劃 */
            padding: 0 20px;   /* 左右留白，防止字母筆劃超出 */
            display: inline-block;
            white-space: nowrap;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .handwritten-text.show {
            opacity: 1;
            transform: scale(1);
        }

        .bottom-hint {
            position: absolute;
            bottom: 50px;
            font-size: 0.95rem;
            color: #64748b;
            letter-spacing: 1px;
            animation: breathe 2.5s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 0.9; transform: translateY(-4px); }
        }
    </style>
</head>
<body onclick="enterApp()">

    <div class="welcome-box">
        <div class="handwritten-text" id="text">Hello.</div>
    </div>

    <div class="bottom-hint">點擊畫面任意處進入 ➔</div>

    <script>
        const list = [
            { text: "Cale study", font: "'Caveat', cursive" },
            { text: "Cale學習", font: "'DFKai-SB', '標楷體', 'STKaiti', '楷體', serif" },
            { text: "Cale aprende", font: "'Caveat', cursive" }
        ];

        let index = 0;
        const textEl = document.getElementById("text");

        function switchGreeting() {
            textEl.classList.remove("show");
            
            setTimeout(() => {
                const current = list[index];
                textEl.style.fontFamily = current.font;
                textEl.innerText = current.text;
                textEl.classList.add("show");
                index = (index + 1) % list.length;
            }, 800);
        }

        switchGreeting();
        setInterval(switchGreeting, 2800);

        function enterApp() {
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
