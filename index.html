<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }

        .svg-container {
            width: 320px;
            height: 120px;
        }

        /* SVG 筆劃路徑樣式 */
        .handwritten-path {
            fill: none;
            stroke: #38bdf8; /* 高質感發光藍色 */
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            /* 設定長度與偏移，創造一筆一畫寫出來的效果 */
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawStroke 3s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
        }

        /* 筆劃順著路線畫出的關鍵影格 */
        @keyframes drawStroke {
            0% {
                stroke-dashoffset: 1000;
            }
            80%, 100% {
                stroke-dashoffset: 0;
            }
        }

        .bottom-hint {
            position: absolute;
            bottom: 50px;
            font-size: 0.95rem;
            color: #64748b;
            letter-spacing: 1px;
            animation: breathe 2.5s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 0.9; transform: translateY(-4px); }
        }
    </style>
</head>
<body onclick="enterApp()">

    <!-- 真正的草寫 Hello SVG 筆劃路徑 -->
    <div class="svg-container">
        <svg viewBox="0 0 500 150" width="100%" height="100%">
            <path class="handwritten-path" d="
                M 30,80 Q 25,30 25,100 M 25,65 Q 55,60 55,30 Q 55,100 55,100 
                M 85,75 Q 110,40 85,90 Q 70,105 100,90
                M 120,20 L 120,100
                M 145,20 L 145,100
                M 175,70 Q 160,100 190,100 Q 210,100 195,70 Q 175,70 180,100
            " />
        </svg>
    </div>

    <div class="bottom-hint">點擊畫面任意處進入 ➔</div>

    <script>
        function enterApp() {
            alert("進入主畫面！（下一步我們來做『科目選擇』與『主題單字庫』）");
        }
    </script>
</body>
</html>
