<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cale study app - 管理員後台</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --accent-color: #58a6ff;
            --danger-color: #ff7b72;
            --warning-color: #d29922;
            --success-color: #238636;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 980px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
        }

        h1 {
            color: var(--accent-color);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        th {
            color: var(--accent-color);
            background: rgba(255, 255, 255, 0.02);
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-limit {
            background-color: var(--success-color);
            color: #ffffff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-edit {
            background-color: var(--warning-color);
            color: #ffffff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-reset {
            background-color: var(--danger-color);
            color: #ffffff;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .btn-limit:hover, .btn-edit:hover, .btn-reset:hover { opacity: 0.8; }

        .login-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .login-box {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 12px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .login-box input {
            padding: 8px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            outline: none;
        }

        .login-box button {
            padding: 8px;
            background: var(--accent-color);
            color: #0d1117;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>

    <!-- Firebase SDK 引入 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChKI6znPkXg-lAKilYx2ezDmmTUM6_f7s",
            authDomain: "cale-study-app-41b9b.firebaseapp.com",
            projectId: "cale-study-app-41b9b",
            storageBucket: "cale-study-app-41b9b.firebasestorage.app",
            messagingSenderId: "819450732167",
            appId: "1:819450732167:web:a727579df57eb9da33e222",
            measurementId: "G-GP1XCE9W5E"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const ADMIN_PASSWORD = "admin123";

        window.verifyAdmin = function() {
            const pwd = document.getElementById('adminPwd').value;
            if (pwd === ADMIN_PASSWORD) {
                document.getElementById('loginOverlay').style.display = 'none';
                loadUsers();
            } else {
                alert('❌ 密碼錯誤！');
            }
        };

        async function loadUsers() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">正在載入資料庫使用者...</td></tr>';

            try {
                const querySnapshot = await getDocs(collection(db, "users"));
                tbody.innerHTML = '';

                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#8b949e;">目前尚無使用者記錄</td></tr>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const tr = document.createElement('tr');
                    
                    const displayUid = data.uid || docSnap.id;
                    const usageCount = data.usage !== undefined ? data.usage : 0;
                    const maxLimit = data.maxLimit !== undefined ? data.maxLimit : 50;
                    const lastMsg = data.lastMessage || '無紀錄';

                    tr.innerHTML = `
                        <td><code>${displayUid}</code></td>
                        <td><b>${usageCount}</b> / ${maxLimit} 次</td>
                        <td>${lastMsg}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-limit" onclick="editMaxLimit('${docSnap.id}', ${maxLimit})">⚙️ 調整上限</button>
                                <button class="btn-edit" onclick="editUserUsage('${docSnap.id}', ${usageCount})">✏️ 調整用量</button>
                                <button class="btn-reset" onclick="resetUser('${docSnap.id}')">歸零</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error("載入失敗:", e);
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">❌ 載入失敗: ${e.message}</td></tr>`;
            }
        }

        // 1. 調整總使用上限
        window.editMaxLimit = async function(docId, currentLimit) {
            const input = prompt(`請輸入 ${docId} 的「總使用次數上限」（目前為 ${currentLimit}）：`, currentLimit);
            if (input === null) return;

            const newLimit = parseInt(input, 10);
            if (isNaN(newLimit) || newLimit < 0) {
                alert("❌ 請輸入有效的數字！");
                return;
            }

            try {
                const userRef = doc(db, "users", docId);
                await updateDoc(userRef, { maxLimit: newLimit });
                alert(`✅ 成功將上限調整為 ${newLimit} 次！`);
                loadUsers();
            } catch (e) {
                alert("❌ 調整失敗: " + e.message);
            }
        };

        // 2. 調整已使用次數
        window.editUserUsage = async function(docId, currentUsage) {
            const input = prompt(`請輸入 ${docId} 的「已使用次數」（目前為 ${currentUsage}）：`, currentUsage);
            if (input === null) return;

            const newUsage = parseInt(input, 10);
            if (isNaN(newUsage) || newUsage < 0) {
                alert("❌ 請輸入有效的數字！");
                return;
            }

            try {
                const userRef = doc(db, "users", docId);
                await updateDoc(userRef, { usage: newUsage });
                alert(`✅ 成功將已用次數調整為 ${newUsage} 次！`);
                loadUsers();
            } catch (e) {
                alert("❌ 調整失敗: " + e.message);
            }
        };

        // 3. 歸零
        window.resetUser = async function(docId) {
            if (!confirm(`確定要將 ${docId} 的使用次數歸零嗎？`)) return;
            try {
                const userRef = doc(db, "users", docId);
                await updateDoc(userRef, { usage: 0 });
                alert("✅ 已成功重置為 0 次！");
                loadUsers();
            } catch (e) {
                alert("❌ 重置失敗: " + e.message);
            }
        };
    </script>
</head>
<body>

    <!-- 管理員登入遮罩 -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h3>🔐 管理員後台登入</h3>
            <input type="password" id="adminPwd" placeholder="請輸入管理員密碼" onkeydown="if(event.key==='Enter')verifyAdmin()">
            <button onclick="verifyAdmin()">登入</button>
        </div>
    </div>

    <!-- 後台主畫面 -->
    <div class="container">
        <h1>⚙️ Cale Study App — 所有使用者管理面板</h1>
        <p style="font-size: 0.9rem; color: #8b949e;">在此可檢視所有連線學生的用量與上限，並可靈活調整每日額度或重置次數。</p>
        
        <table>
            <thead>
                <tr>
                    <th>使用者 UID</th>
                    <th>目前使用 / 總上限</th>
                    <th>最後對話內容</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- 動態載入 -->
            </tbody>
        </table>
    </div>

</body>
</html>
