<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國文與文言文 - Cale Study</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Canvas Confetti 彩帶套件 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- 引入 Firebase SDK (Compat 版本) - 與 en.html 同步 -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .main-card {
            background-color: #161e2e;
            border: 1px solid #273549;
            border-radius: 16px;
            position: relative;
        }

        /* XP 標籤 */
        .xp-badge {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f59e0b;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 下拉選單風格 */
        .custom-dropdown-btn {
            background-color: #1e293b;
            border: 1px solid #3b82f6;
            color: #ffffff;
            border-radius: 14px;
            padding: 12px 20px;
            width: 100%;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            cursor: pointer;
        }

        .custom-dropdown-menu {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            width: 100%;
            max-height: 320px;
            overflow-y: auto;
            margin-top: 8px;
            padding: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;
            position: absolute;
            z-index: 1000;
        }

        .custom-dropdown-item {
            color: #e2e8f0;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .custom-dropdown-item:hover {
            background-color: #334155;
            color: #ffffff;
        }

        .custom-dropdown-item.active {
            background-color: #2563eb;
            color: #ffffff;
        }

        /* 內容區塊 */
        .content-box {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
        }

        .text-highlight {
            color: #60a5fa;
        }

        /* 測驗選項風格 */
        .quiz-option {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 12px;
            padding: 14px 18px;
            text-align: left;
            width: 100%;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .quiz-option:hover:not(:disabled) {
            border-color: #3b82f6;
            background-color: #273549;
        }

        .quiz-option.correct {
            background-color: rgba(34, 197, 94, 0.15) !important;
            border: 2px solid #22c55e !important;
            color: #4ade80 !important;
            font-weight: bold;
        }

        .quiz-option.wrong {
            background-color: rgba(239, 68, 68, 0.15) !important;
            border: 2px solid #ef4444 !important;
            color: #f87171 !important;
        }

        /* 答對回饋提示 */
        .feedback-msg {
            color: #4ade80;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            margin-top: 15px;
            animation: fadeIn 0.3s ease;
        }

        /* 下一題按鈕 */
        .btn-next {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            border: none;
            margin-top: 15px;
            font-size: 1.05rem;
            transition: all 0.2s;
        }

        .btn-next:hover {
            background-color: #7dd3fc;
        }

        /* 浮動 XP 動畫 (與 en.html 一致) */
        .floating-xp {
            position: absolute;
            top: 20px;
            right: 25px;
            color: #fbbf24;
            font-size: 1.4rem;
            font-weight: 800;
            pointer-events: none;
            opacity: 0;
            animation: floatUp 0.8s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(10px); }
            30% { opacity: 1; transform: translateY(-5px); }
            100% { opacity: 0; transform: translateY(-30px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container py-4" style="max-width: 600px;">
        
        <!-- 頂部導覽列 + XP 顯示 -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div class="d-flex align-items-center">
                <a href="dashboard.html" class="text-secondary me-3 fs-4"><i class="bi bi-chevron-left"></i></a>
                <h4 class="mb-0 fw-bold">國文與文言文</h4>
            </div>
            <div class="xp-badge">
                ⚡ <span id="xpCount">0</span> XP
            </div>
        </div>

        <!-- 文章選單 -->
        <div class="position-relative mb-4">
            <button class="custom-dropdown-btn" type="button" id="articleDropdown" onclick="toggleDropdown()">
                <span>📘 <span id="selected-title">載入中...</span></span>
                <i class="bi bi-caret-down-fill text-secondary"></i>
            </button>
            <div class="custom-dropdown-menu" id="dropdown-list"></div>
        </div>

        <!-- 文章內容與測驗區 -->
        <div id="article-display"></div>

    </div>

    <!-- 引入資料檔 -->
    <script src="ch50.js?v=2"></script>

    <script>
        // 初始化 Firebase 設定（與 en.html 一致）
        const firebaseConfig = {
            apiKey: "AIzaSyChKI6znPkXg-lAKilYx2ezDmmTUM6_f7s",
            authDomain: "cale-study-app-41b9b.firebaseapp.com",
            projectId: "cale-study-app-41b9b",
            storageBucket: "cale-study-app-41b9b.firebasestorage.app",
            messagingSenderId: "819450732167",
            appId: "1:819450732167:web:a727579df57eb9da33e222",
            measurementId: "G-GP1XCE9W5E"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentArticles = [];
        let currentArticleIndex = 0;
        let currentQuestionIndex = 0;
        let isDropdownOpen = false;

        let todayCorrectCount = parseInt(localStorage.getItem("todayCorrectCount") || "0");

        // 取得唯一的帳號 Key (與 en.html 完全相同)
        function getUserEmailKey() {
            return localStorage.getItem("accountKey") 
                || localStorage.getItem("userEmail") 
                || localStorage.getItem("currentUser") 
                || localStorage.getItem("username")
                || "default_user";
        }

        function getXPKey() {
            return "xp_" + getUserEmailKey();
        }

        // 讀取本地 XP (捕捉全方位 Key)
        function getUserXP() {
            const key = getXPKey();
            const xpVal = localStorage.getItem(key) 
                       || localStorage.getItem("userXP") 
                       || localStorage.getItem("xp")
                       || localStorage.getItem("user_xp") 
                       || "0";
            return parseInt(xpVal, 10);
        }

        // 雲端同步下載 XP
        async function syncXPFromCloud() {
            const userDocId = getUserEmailKey();
            if (userDocId === "default_user") return;

            try {
                const docRef = db.collection("users").doc(userDocId);
                const docSnap = await docRef.get();

                if (docSnap.exists) {
                    const cloudData = docSnap.data();
                    const cloudXP = cloudData.xp !== undefined ? cloudData.xp : (cloudData.userXP || 0);
                    const localXP = getUserXP();
                    const newXP = Math.max(localXP, cloudXP);
                    
                    saveXPToLocal(newXP);
                    document.getElementById("xpCount").innerText = newXP;
                }
            } catch (err) {
                console.error("雲端同步失敗：", err);
            }
        }

        // 寫入本地所有相容 Key
        function saveXPToLocal(val) {
            localStorage.setItem(getXPKey(), val);
            localStorage.setItem("userXP", val);
            localStorage.setItem("xp", val);
            localStorage.setItem("user_xp", val);
        }

        // 更新 XP 畫面與同步寫入 Firestore
        function updateXPDisplay() {
            const currentXP = getUserXP();
            
            document.getElementById("xpCount").innerText = currentXP;
            saveXPToLocal(currentXP);

            let progressPercent = Math.min(100, Math.round((todayCorrectCount / 20) * 100));
            localStorage.setItem("todayProgressPercent", progressPercent);

            const userDocId = getUserEmailKey();
            if (userDocId !== "default_user") {
                db.collection("users").doc(userDocId).set({
                    xp: currentXP,
                    userXP: currentXP,
                    email: userDocId,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true }).catch(err => console.error("寫入雲端失敗：", err));
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            syncXPFromCloud().then(() => {
                updateXPDisplay();
            });
            initDataCheck();
        });

        // 跨頁面 Storage 監聽
        window.addEventListener('storage', (e) => {
            if (e.key === getXPKey() || e.key === 'userXP' || e.key === 'xp' || e.key === 'user_xp') {
                const newXP = parseInt(e.newValue || "0", 10);
                document.getElementById("xpCount").innerText = newXP;
            }
        });

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function showFloatingXP(text) {
            const container = document.querySelector(".main-card");
            if (!container) return;
            const xpFloat = document.createElement("div");
            xpFloat.className = "floating-xp";
            xpFloat.innerText = text;
            container.appendChild(xpFloat);

            setTimeout(() => {
                xpFloat.remove();
            }, 800);
        }

        function initDataCheck() {
            const data = (typeof window.articles !== 'undefined') ? window.articles : (typeof articles !== 'undefined' ? articles : null);

            if (data && data.length > 0) {
                currentArticles = data;
                initDropdownMenu();
                loadArticle(0);
            } else {
                setTimeout(initDataCheck, 100);
            }
        }

        function initDropdownMenu() {
            const listContainer = document.getElementById('dropdown-list');
            if (!listContainer) return;

            listContainer.innerHTML = currentArticles.map((art, index) => `
                <div class="custom-dropdown-item ${index === 0 ? 'active' : ''}" onclick="selectArticle(${index})">
                    📘 ${art.title}
                </div>
            `).join('');

            document.getElementById('selected-title').innerText = currentArticles[0].title;
        }

        function toggleDropdown() {
            const dropdownMenu = document.getElementById('dropdown-list');
            isDropdownOpen = !isDropdownOpen;
            dropdownMenu.style.display = isDropdownOpen ? 'block' : 'none';
        }

        function selectArticle(index) {
            currentArticleIndex = index;
            currentQuestionIndex = 0;
            document.getElementById('selected-title').innerText = currentArticles[index].title;

            const items = document.querySelectorAll('.custom-dropdown-item');
            items.forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });

            isDropdownOpen = false;
            document.getElementById('dropdown-list').style.display = 'none';

            loadArticle(index);
        }

        function loadArticle(index) {
            const art = currentArticles[index];
            const displayArea = document.getElementById('article-display');
            const totalQuestions = art.questions ? art.questions.length : 0;
            const currentQ = (totalQuestions > 0 && art.questions[currentQuestionIndex]) ? art.questions[currentQuestionIndex] : null;

            displayArea.innerHTML = `
                <div class="main-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold mb-0 text-white">${art.title}</h4>
                        <span class="badge bg-primary px-3 py-2 rounded-pill">${art.author}</span>
                    </div>

                    <div class="mb-3">
                        <label class="text-secondary small fw-bold mb-1">【原文】</label>
                        <div class="content-box fs-5 lh-lg text-white">
                            ${art.content}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="text-secondary small fw-bold mb-1">【白話文翻譯】</label>
                        <div class="content-box text-secondary fs-6 lh-base" style="background-color: #121926;">
                            ${art.translation}
                        </div>
                    </div>

                    ${art.notes && art.notes.length > 0 ? `
                        <div class="mb-3">
                            <label class="text-secondary small fw-bold mb-2">【字詞釋義】</label>
                            <div class="d-flex flex-wrap gap-2">
                                ${art.notes.map(n => `
                                    <span class="badge bg-dark text-light border border-secondary p-2 font-monospace fs-6">
                                        <span class="text-highlight">${n.word}</span>：${n.detail}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${currentQ ? `
                        <div class="mt-4 pt-3 border-top border-secondary" id="quiz-section">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label class="text-warning small fw-bold mb-0"><i class="bi bi-pencil-square"></i> 隨堂測驗</label>
                                <span class="badge bg-secondary">第 ${currentQuestionIndex + 1} /${totalQuestions} 題</span>
                            </div>
                            <p class="fw-bold mb-3 text-white fs-5">${currentQ.q}</p>
                            <div class="d-grid gap-2" id="quiz-container">
                                ${currentQ.options.map((opt, optIndex) => `
                                    <button class="quiz-option" onclick="checkAnswer(${optIndex}, ${currentQ.answer}, this)">
                                        ${String.fromCharCode(65 + optIndex)}.${opt}
                                    </button>
                                `).join('')}
                            </div>
                            <div id="feedback"></div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function checkAnswer(selectedIndex, correctIndex, btn) {
            const container = document.getElementById('quiz-container');
            const buttons = container.querySelectorAll('button');
            const feedbackDiv = document.getElementById('feedback');
            const art = currentArticles[currentArticleIndex];
            const isLastQuestion = currentQuestionIndex === art.questions.length - 1;

            buttons.forEach(b => b.disabled = true);

            let feedbackHTML = '';

            if (selectedIndex === correctIndex) {
    btn.classList.add('correct');
    const addedXP = 5; // 國文答對給予 5 XP
    
    todayCorrectCount++;
    localStorage.setItem("todayCorrectCount", todayCorrectCount);

    // 1. 累加國文專屬 XP (xp_zh)
    let currentZhXP = parseInt(localStorage.getItem("xp_zh") || "0", 10) + addedXP;
    localStorage.setItem("xp_zh", currentZhXP);

    // 2. 算總 XP 並儲存/更新畫面 (保持頁面即時顯示)
    let currentXP = getUserXP() + addedXP;
    saveXPToLocal(currentXP);
    updateXPDisplay();

    showFloatingXP(`+${addedXP} XP`);
    feedbackHTML = `<div class="feedback-msg">🎉 答對了！(+${addedXP} XP)</div>`;
} else {
    btn.classList.add('wrong');
    buttons[correctIndex].classList.add('correct');
    feedbackHTML = `<div class="feedback-msg text-danger">❌ 答錯了，再接再勵！</div>`;
}

            if (isLastQuestion) {
                triggerConfetti();
                feedbackHTML += `
                    <button class="btn-next" style="background-color: #22c55e; color: #fff;" onclick="nextArticle()">
                        🎉 完成本篇，下一篇 ➔
                    </button>
                `;
            } else {
                feedbackHTML += `
                    <button class="btn-next" onclick="nextQuestion()">下一題 ➔</button>
                `;
            }

            feedbackDiv.innerHTML = feedbackHTML;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            loadArticle(currentArticleIndex);
            
            const quizSection = document.getElementById('quiz-section');
            if (quizSection) {
                quizSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function nextArticle() {
            const nextIndex = (currentArticleIndex + 1) % currentArticles.length;
            selectArticle(nextIndex);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('dropdown-list');
            const button = document.getElementById('articleDropdown');
            if (dropdown && button && !button.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
                isDropdownOpen = false;
            }
        });
    </script>
</body>
</html>
