<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國文與文言文 - Cale Study</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .main-card {
            background-color: #161e2e;
            border: 1px solid #273549;
            border-radius: 16px;
        }

        /* XP 標籤 */
        .xp-badge {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #f59e0b;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 下拉選單風格 */
        .custom-dropdown-btn {
            background-color: #1e293b;
            border: 1px solid #3b82f6;
            color: #ffffff;
            border-radius: 14px;
            padding: 12px 20px;
            width: 100%;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
            cursor: pointer;
        }

        .custom-dropdown-menu {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            width: 100%;
            max-height: 320px;
            overflow-y: auto;
            margin-top: 8px;
            padding: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            display: none;
            position: absolute;
            z-index: 1000;
        }

        .custom-dropdown-item {
            color: #e2e8f0;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .custom-dropdown-item:hover {
            background-color: #334155;
            color: #ffffff;
        }

        .custom-dropdown-item.active {
            background-color: #2563eb;
            color: #ffffff;
        }

        /* 內容區塊 */
        .content-box {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
        }

        .text-highlight {
            color: #60a5fa;
        }

        /* 測驗選項風格 */
        .quiz-option {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 12px;
            padding: 14px 18px;
            text-align: left;
            width: 100%;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .quiz-option:hover:not(:disabled) {
            border-color: #3b82f6;
            background-color: #273549;
        }

        .quiz-option.correct {
            background-color: rgba(34, 197, 94, 0.15) !important;
            border: 2px solid #22c55e !important;
            color: #4ade80 !important;
            font-weight: bold;
        }

        .quiz-option.wrong {
            background-color: rgba(239, 68, 68, 0.15) !important;
            border: 2px solid #ef4444 !important;
            color: #f87171 !important;
        }

        /* 答對回饋提示 */
        .feedback-msg {
            color: #4ade80;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            margin-top: 15px;
            animation: fadeIn 0.3s ease;
        }

        /* 下一題按鈕 */
        .btn-next {
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            border: none;
            margin-top: 15px;
            font-size: 1.05rem;
            transition: all 0.2s;
        }

        .btn-next:hover {
            background-color: #7dd3fc;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container py-4" style="max-width: 600px;">
        
        <!-- 頂部導覽列 + XP 顯示 -->
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div class="d-flex align-items-center">
                <a href="index.html" class="text-secondary me-3 fs-4"><i class="bi bi-chevron-left"></i></a>
                <h4 class="mb-0 fw-bold">國文與文言文</h4>
            </div>
            <div class="xp-badge">
                ⚡ <span id="xp-display">0</span> XP
            </div>
        </div>

        <!-- 文章選單 -->
        <div class="position-relative mb-4">
            <button class="custom-dropdown-btn" type="button" id="articleDropdown" onclick="toggleDropdown()">
                <span>📘 <span id="selected-title">載入中...</span></span>
                <i class="bi bi-caret-down-fill text-secondary"></i>
            </button>
            <div class="custom-dropdown-menu" id="dropdown-list"></div>
        </div>

        <!-- 文章內容與測驗區 -->
        <div id="article-display"></div>

    </div>

    <!-- 引入資料檔（修正為根目錄路徑，並加上版本號） -->
    <script src="ch50.js?v=2"></script>

    <script>
        let currentArticles = [];
        let isDropdownOpen = false;
        let userXP = parseInt(localStorage.getItem("user_xp") || "0");

        document.addEventListener("DOMContentLoaded", () => {
            updateXPDisplay();
            initDataCheck();
        });

        // 更新 XP 畫面與儲存
        function updateXPDisplay() {
            document.getElementById("xp-display").innerText = userXP;
            localStorage.setItem("user_xp", userXP);
        }

        // 讀取文章資料
        function initDataCheck() {
            const data = (typeof window.articles !== 'undefined') ? window.articles : (typeof articles !== 'undefined' ? articles : null);

            if (data && data.length > 0) {
                currentArticles = data;
                initDropdownMenu();
                loadArticle(0);
            } else {
                setTimeout(initDataCheck, 100);
            }
        }

        // 初始化下拉清單
        function initDropdownMenu() {
            const listContainer = document.getElementById('dropdown-list');
            if (!listContainer) return;

            listContainer.innerHTML = currentArticles.map((art, index) => `
                <div class="custom-dropdown-item ${index === 0 ? 'active' : ''}" onclick="selectArticle(${index})">
                    📘 ${art.title}
                </div>
            `).join('');

            document.getElementById('selected-title').innerText = currentArticles[0].title;
        }

        function toggleDropdown() {
            const dropdownMenu = document.getElementById('dropdown-list');
            isDropdownOpen = !isDropdownOpen;
            dropdownMenu.style.display = isDropdownOpen ? 'block' : 'none';
        }

        function selectArticle(index) {
            document.getElementById('selected-title').innerText = currentArticles[index].title;

            const items = document.querySelectorAll('.custom-dropdown-item');
            items.forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });

            isDropdownOpen = false;
            document.getElementById('dropdown-list').style.display = 'none';

            loadArticle(index);
        }

        // 載入文章與測驗
        function loadArticle(index) {
            const art = currentArticles[index];
            const displayArea = document.getElementById('article-display');

            displayArea.innerHTML = `
                <div class="main-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold mb-0 text-white">${art.title}</h4>
                        <span class="badge bg-primary px-3 py-2 rounded-pill">${art.author}</span>
                    </div>

                    <!-- 原文 -->
                    <div class="mb-3">
                        <label class="text-secondary small fw-bold mb-1">【原文】</label>
                        <div class="content-box fs-5 lh-lg text-white">
                            ${art.content}
                        </div>
                    </div>

                    <!-- 翻譯 -->
                    <div class="mb-3">
                        <label class="text-secondary small fw-bold mb-1">【白話文翻譯】</label>
                        <div class="content-box text-secondary fs-6 lh-base" style="background-color: #121926;">
                            ${art.translation}
                        </div>
                    </div>

                    <!-- 字詞釋義 -->
                    ${art.notes && art.notes.length > 0 ? `
                        <div class="mb-3">
                            <label class="text-secondary small fw-bold mb-2">【字詞釋義】</label>
                            <div class="d-flex flex-wrap gap-2">
                                ${art.notes.map(n => `
                                    <span class="badge bg-dark text-light border border-secondary p-2 font-monospace fs-6">
                                        <span class="text-highlight">${n.word}</span>：${n.detail}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <!-- 隨堂測驗區塊 -->
                    ${art.questions && art.questions.length > 0 ? `
                        <div class="mt-4 pt-3 border-top border-secondary">
                            <label class="text-warning small fw-bold mb-2"><i class="bi bi-pencil-square"></i> 隨堂測驗</label>
                            ${art.questions.map((q, qIndex) => `
                                <p class="fw-bold mb-3 text-white fs-5">${q.q}</p>
                                <div class="d-grid gap-2" id="quiz-container-${qIndex}">
                                    ${q.options.map((opt, optIndex) => `
                                        <button class="quiz-option" onclick="checkAnswer(${index},${qIndex}, ${optIndex},${q.answer}, this)">
                                            ${String.fromCharCode(65 + optIndex)}.${opt}
                                        </button>
                                    `).join('')}
                                </div>
                                <div id="feedback-${qIndex}"></div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 答題判斷 + 加 XP 功能
        function checkAnswer(artIndex, qIndex, selectedIndex, correctIndex, btn) {
            const container = document.getElementById(`quiz-container-${qIndex}`);
            const buttons = container.querySelectorAll('button');
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);

            // 停用所有按鈕防止重複點擊
            buttons.forEach(b => b.disabled = true);

            if (selectedIndex === correctIndex) {
                // 答對處理
                btn.classList.add('correct');
                
                // 增加 XP (預設 +10)
                const addedXP = 10;
                userXP += addedXP;
                updateXPDisplay();

                // 顯示答對訊息與下一題按鈕
                feedbackDiv.innerHTML = `
                    <div class="feedback-msg">🎉 答對了！(+${addedXP} XP)</div>
                    <button class="btn-next" onclick="nextArticle(${artIndex})">下一題 ➔</button>
                `;
            } else {
                // 答錯處理
                btn.classList.add('wrong');
                buttons[correctIndex].classList.add('correct'); // 標示正確答案
                
                feedbackDiv.innerHTML = `
                    <div class="feedback-msg text-danger">❌ 答錯了，再接再厲！</div>
                    <button class="btn-next" onclick="nextArticle(${artIndex})">下一題 ➔</button>
                `;
            }
        }

        // 切換至下一篇文章/題目
        function nextArticle(currentIndex) {
            const nextIndex = (currentIndex + 1) % currentArticles.length;
            selectArticle(nextIndex);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 點擊外面時收合選單
        document.addEventListener('click', (e) => {
            const dropdown = document.getElementById('dropdown-list');
            const button = document.getElementById('articleDropdown');
            if (dropdown && button && !button.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.style.display = 'none';
                isDropdownOpen = false;
            }
        });
    </script>
</body>
</html>
