<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國文與文言文 - Cale Study</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0b0f19; /* 深色背景 */
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .main-card {
            background-color: #161e2e;
            border: 1px solid #273549;
            border-radius: 16px;
        }

        /* 下拉選單自訂風格 (模仿圖1) */
        .custom-dropdown-btn {
            background-color: #1e293b;
            border: 1px solid #3b82f6;
            color: #ffffff;
            border-radius: 14px;
            padding: 12px 20px;
            width: 100%;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 500;
        }

        .custom-dropdown-btn:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.4);
        }

        .custom-dropdown-menu {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 14px;
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 8px;
            padding: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .custom-dropdown-item {
            color: #e2e8f0;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .custom-dropdown-item:hover {
            background-color: #334155;
            color: #ffffff;
        }

        .custom-dropdown-item.active {
            background-color: #2563eb;
            color: #ffffff;
        }

        /* 內容區塊 */
        .content-box {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
        }

        .text-highlight {
            color: #60a5fa;
        }

        /* 隨堂測驗選項按鈕 */
        .quiz-option {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 10px 14px;
            text-align: left;
            width: 100%;
            transition: all 0.2s;
        }

        .quiz-option:hover {
            border-color: #3b82f6;
            background-color: #273549;
        }
    </style>
</head>
<body>

    <div class="container py-4" style="max-width: 600px;">
        
        <!-- 頂部返回區塊 -->
        <div class="d-flex align-items-center mb-4">
            <a href="index.html" class="text-secondary me-3 fs-4"><i class="bi bi-chevron-left"></i></a>
            <h4 class="mb-0 fw-bold">國文與文言文</h4>
        </div>

        <!-- 1: 自訂下拉選單 (選文章) -->
        <div class="dropdown mb-4">
            <button class="custom-dropdown-btn dropdown-toggle" type="button" id="articleDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                <span>📘 <span id="selected-title">載入中...</span></span>
            </button>
            <ul class="dropdown-menu custom-dropdown-menu" id="dropdown-list" aria-labelledby="articleDropdown">
                <!-- 由 JS 動態生成 50 篇選單 -->
            </ul>
        </div>

        <!-- 文章展示卡片 -->
        <div id="article-display">
            <!-- 由 JS 動態填入選中的文章 -->
        </div>

    </div>

    <!-- 引入資料檔 cale/ch50.js -->
    <script src="cale/ch50.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof articles !== 'undefined' && articles.length > 0) {
                initDropdown();
                loadArticle(0); // 預設載入第一篇
            }
        });

        // 初始化下拉選單
        function initDropdown() {
            const listContainer = document.getElementById('dropdown-list');
            listContainer.innerHTML = articles.map((art, index) => `
                <li>
                    <div class="custom-dropdown-item ${index === 0 ? 'active' : ''}" onclick="selectArticle(${index})">
                        📘 ${art.title}
                    </div>
                </li>
            `).join('');
        }

        // 切換文章
        function selectArticle(index) {
            // 更新選單標題
            document.getElementById('selected-title').innerText = articles[index].title;
            
            // 更新選單 active 狀態
            const items = document.querySelectorAll('.custom-dropdown-item');
            items.forEach((item, i) => {
                if (i === index) item.classList.add('active');
                else item.classList.remove('active');
            });

            // 渲染內容
            loadArticle(index);
        }

        // 渲染單篇文章內容
        function loadArticle(index) {
            const art = articles[index];
            const displayArea = document.getElementById('article-display');

            displayArea.innerHTML = `
                <div class="main-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="fw-bold mb-0 text-white">${art.title}</h4>
                        <span class="badge bg-primary px-3 py-2 rounded-pill">${art.author}</span>
                    </div>

                    <!-- 原文 -->
                    <div class="mb-3">
                        <label class="text-secondary small fw-bold mb-1">【原文】</label>
                        <div class="content-box fs-5 lh-lg text-white">
                            ${art.content}
                        </div>
                    </div>

                    <!-- 翻譯 -->
                    <div class="mb-3">
                        <label class="text-secondary small fw-bold mb-1">【白話文翻譯】</label>
                        <div class="content-box text-secondary fs-6 lh-base" style="background-color: #121926;">
                            ${art.translation}
                        </div>
                    </div>

                    <!-- 註釋 -->
                    ${art.notes && art.notes.length > 0 ? `
                        <div class="mb-3">
                            <label class="text-secondary small fw-bold mb-2">【字詞釋義】</label>
                            <div class="d-flex flex-wrap gap-2">
                                ${art.notes.map(n => `
                                    <span class="badge bg-dark text-light border border-secondary p-2 font-monospace fs-6">
                                        <span class="text-highlight">${n.word}</span>：${n.detail}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    <!-- 隨堂測驗 -->
                    ${art.questions && art.questions.length > 0 ? `
                        <div class="mt-4 pt-3 border-top border-secondary">
                            <label class="text-warning small fw-bold mb-2"><i class="bi bi-pencil-square"></i> 隨堂測驗</label>
                            ${art.questions.map((q, qIndex) => `
                                <p class="fw-bold mb-2 text-white">${q.q}</p>
                                <div class="d-grid gap-2">
                                    ${q.options.map((opt, optIndex) => `
                                        <button class="quiz-option" onclick="checkAnswer(${index},${qIndex}, ${optIndex},${q.answer}, this)">
                                            ${optIndex + 1}.${opt}
                                        </button>
                                    `).join('')}
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // 簡單的答題判斷
        function checkAnswer(artIndex, qIndex, selectedIndex, correctIndex, btn) {
            const parent = btn.parentElement;
            const buttons = parent.querySelectorAll('button');
            buttons.forEach(b => b.disabled = true);

            if (selectedIndex === correctIndex) {
                btn.style.backgroundColor = '#15803d';
                btn.style.borderColor = '#22c55e';
                btn.innerText += '  ✓ 正確！';
            } else {
                btn.style.backgroundColor = '#b91c1c';
                btn.style.borderColor = '#ef4444';
                btn.innerText += '  ✗ 錯誤';
                
                // 標示正確答案
                buttons[correctIndex].style.backgroundColor = '#15803d';
            }
        }
    </script>
</body>
</html>
