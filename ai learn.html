<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cale study app - AI 對話學習助手</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/3323jaydenjayden-sketch/cale/refs/heads/main/image.png">
    <style>
        :root {
            --bg-color: #0d1117;
            --chat-bg: #161b22;
            --user-msg: #1f6feb;
            --ai-msg: #21262d;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --accent-color: #58a6ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 頂部 Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.5rem;
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-container img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }

        .logo-container h1 {
            font-size: 1.1rem;
            color: #f0f6fc;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        select.model-select {
            background-color: #0d1117;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        /* 主聊天區 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .msg-bubble {
            padding: 0.8rem 1.1rem;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user .msg-bubble {
            background-color: var(--user-msg);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .assistant .msg-bubble {
            background-color: var(--ai-msg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        .msg-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin-bottom: 6px;
        }

        /* 底部輸入區 */
        .input-container {
            padding: 1rem 1.5rem;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .image-preview-bar {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 6px;
            width: fit-content;
        }

        .image-preview-bar img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .remove-img-btn {
            background: none;
            border: none;
            color: #ff7b72;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            outline: none;
            padding: 4px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: color 0.2s;
        }

        .icon-btn:hover {
            color: var(--text-color);
        }

        .send-btn {
            background-color: var(--accent-color);
            color: #0d1117;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .send-btn:disabled {
            background-color: #30363d;
            color: #484f58;
            cursor: not-allowed;
        }

        /* 管理員彈窗 (Admin Modal) */
        .admin-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .admin-content {
            background: var(--chat-bg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: 12px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .admin-content h3 {
            color: var(--accent-color);
        }

        .admin-content button {
            padding: 8px;
            background: var(--user-msg);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .admin-content button.close-btn {
            background: #30363d;
        }
    </style>
</head>
<body>

    <!-- 頂部導覽 -->
    <header>
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/3323jaydenjayden-sketch/cale/refs/heads/main/image.png" alt="Logo">
            <h1>cale study app</h1>
        </div>
        <div class="header-controls">
            <!-- 模型選擇 -->
            <select class="model-select" id="modelSelect">
                <option value="qwen/qwen3.8-27b">Qwen 3.8 27B (預設視覺與推理)</option>
                <option value="openai/gpt-oss-120b">GPT OSS 120B (核心大腦)</option>
                <option value="openai/gpt-oss-20b">GPT OSS 20B (輕量先鋒)</option>
                <option value="whisper-large-v3">Whisper Large v3 (語音辨識)</option>
            </select>
        </div>
    </header>

    <!-- 聊天紀錄區 -->
    <div class="chat-container" id="chatContainer">
        <div class="message assistant">
            <div class="msg-bubble">你好！我是你的 AI 對話學習助手。你可以直接和我聊天出題，或是點擊下方 📷 按鈕上傳照片讓我幫你分析！</div>
        </div>
    </div>

    <!-- 底部輸入區 -->
    <div class="input-container">
        <div class="input-wrapper">
            <!-- 圖片預覽列 -->
            <div class="image-preview-bar" id="imagePreviewBar">
                <img id="imagePreview" src="" alt="預覽">
                <button class="remove-img-btn" onclick="removeImage()">✕ 移除圖片</button>
            </div>

            <div class="input-row">
                <!-- 圖片上傳按鈕 -->
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="上傳照片">📷</button>
                <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">

                <!-- 文字輸入框 -->
                <textarea id="userInput" placeholder="輸入訊息或輸入 admin1 開啟管理員選單..." rows="1" onkeydown="handleKeyDown(event)"></textarea>

                <!-- 發送按鈕 -->
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">發送</button>
            </div>
        </div>
    </div>

    <!-- Admin 管理員彈窗 -->
    <div class="admin-modal" id="adminModal">
        <div class="admin-content">
            <h3>⚙️ admin1 管理員後台</h3>
            <p>使用者目前已使用次數：<b id="adminUsageCount">0</b> / 50 次</p>
            <button onclick="resetUsage()">🔄 重置使用次數 (歸零)</button>
            <button class="close-btn" onclick="closeAdminModal()">關閉面板</button>
        </div>
    </div>

    <script>
        // API Key 拆分儲存
        const API1 = "gsk_CdR1Ud84AHrQAEpxy5";
        const API2 = "ExWGdyb3FYU23LjWM9tFLdiRFZuDeErj99";

        // 用量限制設定
        const MAX_LIMIT = 50;
        let currentUsage = parseInt(localStorage.getItem('user_chat_usage') || '0');
        let currentBase64Image = "";

        // 對話歷史紀錄 (Context Memory)
        let conversationHistory = [];

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                currentBase64Image = e.target.result;
                document.getElementById('imagePreview').src = currentBase64Image;
                document.getElementById('imagePreviewBar').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            currentBase64Image = "";
            document.getElementById('fileInput').value = "";
            document.getElementById('imagePreviewBar').style.display = 'none';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();

            if (!text && !currentBase64Image) return;

            // 檢查是否輸入管理員指令
            if (text === 'admin1') {
                openAdminModal();
                inputEl.value = '';
                return;
            }

            // 檢查使用次數限制
            if (currentUsage >= MAX_LIMIT) {
                appendMessage('assistant', '⚠️ 今日對話次數已達上限 (50/50)，請聯繫管理員重置。');
                return;
            }

            const selectedModel = document.getElementById('modelSelect').value;
            const sendBtn = document.getElementById('sendBtn');

            // 渲染使用者訊息
            appendMessage('user', text, currentBase64Image);

            // 清空輸入
            inputEl.value = '';
            const tempImage = currentBase64Image;
            removeImage();

            // 構建傳送給 AI 的 Message 結構
            let userContent = [];
            if (text) {
                userContent.push({ type: "text", text: text });
            }
            if (tempImage) {
                userContent.push({
                    type: "image_url",
                    image_url: { url: tempImage }
                });
            }

            conversationHistory.push({
                role: "user",
                content: userContent.length === 1 && userContent[0].type === "text" ? text : userContent
            });

            // 增加次數並存入 localStorage
            currentUsage++;
            localStorage.setItem('user_chat_usage', currentUsage);

            sendBtn.disabled = true;

            try {
                const fullApiKey = API1 + API2;

                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${fullApiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: conversationHistory,
                        temperature: 0.7
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                const aiReply = data.choices[0].message.content;

                // 記錄歷史
                conversationHistory.push({
                    role: "assistant",
                    content: aiReply
                });

                // 顯示 AI 回應
                appendMessage('assistant', aiReply);

            } catch (error) {
                console.error("請求失敗：", error);
                appendMessage('assistant', '❌ 發生錯誤：' + error.message);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function appendMessage(role, text, imgSrc = null) {
            const chatContainer = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            let innerHTML = '';
            if (imgSrc) {
                innerHTML += `<img src="${imgSrc}" class="msg-image">`;
            }
            if (text) {
                innerHTML += `<div class="msg-bubble">${escapeHtml(text)}</div>`;
            }

            msgDiv.innerHTML = innerHTML;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /* 管理員功能 */
        function openAdminModal() {
            document.getElementById('adminUsageCount').innerText = currentUsage;
            document.getElementById('adminModal').style.display = 'flex';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function resetUsage() {
            currentUsage = 0;
            localStorage.setItem('user_chat_usage', '0');
            document.getElementById('adminUsageCount').innerText = '0';
            alert('已成功重置使用者次數為 0 次！');
        }
    </script>
</body>
</html>
