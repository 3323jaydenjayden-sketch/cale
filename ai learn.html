<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cale study app - AI 對話學習助手</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/3323jaydenjayden-sketch/cale/refs/heads/main/image.png">
    <style>
        :root {
            --bg-color: #0d1117;
            --chat-bg: #161b22;
            --user-msg: #1f6feb;
            --ai-msg: #21262d;
            --text-color: #c9d1d9;
            --border-color: #30363d;
            --accent-color: #58a6ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.5rem;
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-container img {
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }

        .logo-container h1 {
            font-size: 1.1rem;
            color: #f0f6fc;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        select.model-select {
            background-color: #0d1117;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
        }

        .user-status {
            font-size: 0.85rem;
            color: #8b949e;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .message.user { align-self: flex-end; }
        .message.assistant { align-self: flex-start; }

        .msg-bubble {
            padding: 0.8rem 1.1rem;
            border-radius: 12px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user .msg-bubble {
            background-color: var(--user-msg);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .assistant .msg-bubble {
            background-color: var(--ai-msg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        .msg-image {
            max-width: 200px;
            max-height: 200px;
            border-radius: 8px;
            margin-bottom: 6px;
        }

        .input-container {
            padding: 1rem 1.5rem;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--chat-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .image-preview-bar {
            display: none;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 6px;
            width: fit-content;
        }

        .image-preview-bar img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .remove-img-btn {
            background: none;
            border: none;
            color: #ff7b72;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            outline: none;
            padding: 4px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: color 0.2s;
        }

        .icon-btn:hover { color: var(--text-color); }

        .send-btn {
            background-color: var(--accent-color);
            color: #0d1117;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .send-btn:disabled {
            background-color: #30363d;
            color: #484f58;
            cursor: not-allowed;
        }
    </style>

    <!-- Firebase SDK 引入 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // TODO: 替換為你的 Firebase 專案設定
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const API1 = "gsk_CdR1Ud84AHrQAEpxy5";
        const API2 = "ExWGdyb3FYU23LjWM9tFLdiRFZuDeErj99";
        const MAX_LIMIT = 50;

        let currentUser = null;
        let userUsage = 0;
        let currentBase64Image = "";
        let conversationHistory = [];

        // 匿名登入或記錄使用者
        signInAnonymously(auth).catch((error) => {
            console.error("Firebase 登入失敗:", error);
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('userStatus').innerText = `已連線 (ID: ${user.uid.substring(0, 6)}...)`;
                
                // 檢查 Firestore 是否已有該使用者紀錄
                const userDocRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(userDocRef);
                
                if (docSnap.exists()) {
                    userUsage = docSnap.data().usage || 0;
                } else {
                    // 初始化使用者資料
                    await setDoc(userDocRef, {
                        uid: user.uid,
                        usage: 0,
                        lastActive: new Date()
                    });
                    userUsage = 0;
                }
            }
        });

        window.handleFileSelect = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                currentBase64Image = e.target.result;
                document.getElementById('imagePreview').src = currentBase64Image;
                document.getElementById('imagePreviewBar').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        };

        window.removeImage = function() {
            currentBase64Image = "";
            document.getElementById('fileInput').value = "";
            document.getElementById('imagePreviewBar').style.display = 'none';
        };

        window.handleKeyDown = function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };

        window.sendMessage = async function() {
            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();
            if (!text && !currentBase64Image) return;

            if (userUsage >= MAX_LIMIT) {
                appendMessage('assistant', '⚠️ 您的對話次數已達 50 次上限。');
                return;
            }

            const selectedModel = document.getElementById('modelSelect').value;
            const sendBtn = document.getElementById('sendBtn');

            appendMessage('user', text, currentBase64Image);
            inputEl.value = '';
            const tempImage = currentBase64Image;
            removeImage();

            let userContent = tempImage ? [{ type: "text", text: text }, { type: "image_url", image_url: { url: tempImage } }] : text;
            conversationHistory.push({ role: "user", content: userContent });

            // 更新 Firestore 用量
            userUsage++;
            if (currentUser) {
                const userDocRef = doc(db, "users", currentUser.uid);
                await updateDoc(userDocRef, {
                    usage: increment(1),
                    lastActive: new Date(),
                    lastMessage: text || "[圖片訊息]"
                });
            }

            sendBtn.disabled = true;

            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API1 + API2}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: conversationHistory,
                        temperature: 0.7,
                        max_tokens: 800
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                const aiReply = data.choices[0].message.content;
                conversationHistory.push({ role: "assistant", content: aiReply });
                appendMessage('assistant', aiReply);

            } catch (error) {
                appendMessage('assistant', '❌ 發生錯誤：' + error.message);
            } finally {
                sendBtn.disabled = false;
            }
        };

        function appendMessage(role, text, imgSrc = null) {
            const chatContainer = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            let innerHTML = '';
            if (imgSrc) innerHTML += `<img src="${imgSrc}" class="msg-image">`;
            if (text) innerHTML += `<div class="msg-bubble">${escapeHtml(text)}</div>`;
            msgDiv.innerHTML = innerHTML;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/3323jaydenjayden-sketch/cale/refs/heads/main/image.png" alt="Logo">
            <h1>cale study app</h1>
        </div>
        <div class="header-controls">
            <span class="user-status" id="userStatus">連線中...</span>
            <select class="model-select" id="modelSelect">
                <option value="qwen/qwen3.8-27b">Qwen 3.8 27B (視覺推理)</option>
                <option value="meta-llama/llama-4-scout-17b-16e-instruct">Llama 4 Scout</option>
                <option value="openai/gpt-oss-120b">GPT OSS 120B</option>
            </select>
        </div>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message assistant">
            <div class="msg-bubble">你好！我是你的 AI 學習助手，請隨時跟我對話或上傳題目照片！</div>
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <div class="image-preview-bar" id="imagePreviewBar">
                <img id="imagePreview" src="" alt="預覽">
                <button class="remove-img-btn" onclick="removeImage()">✕ 移除圖片</button>
            </div>
            <div class="input-row">
                <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="上傳照片">📷</button>
                <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                <textarea id="userInput" placeholder="輸入訊息，按 Enter 發送..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">發送</button>
            </div>
        </div>
    </div>
</body>
</html>
