<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cale Study App - 萬聖節成就與等級 🎃</title>
    
    <!-- 網站 Favicon 圖示 -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/3323jaydenjayden-sketch/cale/refs/heads/main/image.png">
    
    <!-- 1. 強制登入防護 -->
    <script>
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.replace("login.html");
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: none;
            background-color: #0d0914; /* 萬聖幽暗夜空紫 */
            color: #ffffff;
            min-height: 100vh;
            padding: 2rem 1.2rem;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        .spooky-float {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.12;
            pointer-events: none;
            user-select: none;
            animation: floatAnim 10s infinite ease-in-out alternate;
            z-index: 0;
        }

        @keyframes floatAnim {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-25px) rotate(12deg); }
            100% { transform: translateY(10px) rotate(-12deg); }
        }

        .container {
            width: 100%;
            max-width: 650px;
            z-index: 10;
            position: relative;
        }

        /* 頂部導覽 */
        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
        }

        .back-btn {
            background: rgba(28, 19, 43, 0.85);
            border: 1px solid rgba(255, 117, 24, 0.3);
            color: #ff7518;
            padding: 0.5rem 1rem;
            border-radius: 12px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(255, 117, 24, 0.2);
        }

        .page-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ff9f43;
        }

        /* 等級總覽卡片 */
        .profile-card {
            background: linear-gradient(135deg, rgba(28, 19, 43, 0.85), rgba(15, 10, 24, 0.95));
            border: 1px solid rgba(255, 117, 24, 0.35);
            border-radius: 24px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .avatar-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 1rem auto;
        }

        .user-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #ff7518;
            object-fit: cover;
            box-shadow: 0 0 12px rgba(255, 117, 24, 0.4);
        }

        .level-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: #ff7518;
            color: #0d0914;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 0.2rem 0.5rem;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .username {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }

        .user-title {
            font-size: 0.95rem;
            color: #ff9f43;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* XP 進度條 */
        .xp-bar-container {
            width: 100%;
            background: rgba(13, 9, 20, 0.9);
            border-radius: 10px;
            height: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 117, 24, 0.2);
            margin-bottom: 0.8rem;
        }

        .xp-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff7518, #7b2cbf);
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(255, 117, 24, 0.5);
        }

        .xp-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #a799be;
        }

        /* 標題與分組區塊 */
        .section-header {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 1.5rem 0 1rem 0;
            color: #ff9f43;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* 各科成績卡片區 */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 480px) {
            .subjects-grid {
                grid-template-columns: 1fr;
            }
        }

        .subject-card {
            background: rgba(28, 19, 43, 0.65);
            border: 1px solid rgba(255, 117, 24, 0.25);
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 0.8rem;
        }

        .subject-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .subject-title {
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .subject-xp {
            color: #ff9f43;
            font-weight: 800;
            font-size: 1.1rem;
        }

        .subject-desc {
            font-size: 0.8rem;
            color: #a799be;
        }

        .subject-link {
            text-decoration: none;
            color: #ff7518;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.2rem;
            align-self: flex-end;
            margin-top: 0.4rem;
        }

        .subject-link:hover {
            color: #ffa726;
            text-decoration: underline;
        }

        /* 成就勳章區 */
        .badges-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        @media (max-width: 480px) {
            .badges-grid {
                grid-template-columns: 1fr;
            }
        }

        .badge-card {
            background: rgba(28, 19, 43, 0.4);
            border: 1px solid rgba(255, 117, 24, 0.15);
            border-radius: 16px;
            padding: 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.2s ease;
        }

        .badge-card.unlocked {
            background: rgba(28, 19, 43, 0.85);
            border-color: rgba(255, 117, 24, 0.4);
        }

        .badge-card.locked {
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .badge-icon {
            font-size: 2.2rem;
            background: rgba(13, 9, 20, 0.8);
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            flex-shrink: 0;
            border: 1px solid rgba(255, 117, 24, 0.2);
        }

        .badge-info {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .badge-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
        }

        .badge-desc {
            font-size: 0.8rem;
            color: #a799be;
            line-height: 1.3;
        }

        .footer-brand {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #614e7a;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 萬聖節飄浮裝飾 🎃👻🦇 -->
    <div class="spooky-float" style="top: 5%; left: 12%;">🎃</div>
    <div class="spooky-float" style="top: 85%; left: 88%; animation-delay: -3s;">👻</div>
    <div class="spooky-float" style="top: 40%; right: 5%; animation-delay: -5s;">🦇</div>

    <div class="container">
        <!-- 頂部導覽 -->
        <div class="top-nav">
            <a href="dashboard.html" class="back-btn">➔ 返回萬聖控制台</a>
            <div class="page-title">🎃 萬聖魔法成就與戰報</div>
            <div style="width: 80px;"></div>
        </div>

        <!-- 個人資訊與等級卡片 -->
        <div class="profile-card">
            <div class="avatar-container">
                <img id="userAvatar" src="https://raw.githubusercontent.com/3323jaydenjayden-sketch/cale/refs/heads/main/nobg_image.png" alt="Avatar" class="user-avatar">
                <div class="level-badge" id="levelBadge">Lv.1</div>
            </div>
            <div class="username" id="username">小幽靈</div>
            <div class="user-title" id="userTitle">🎃 萬聖學徒</div>

            <!-- XP 進度條 -->
            <div class="xp-bar-container">
                <div class="xp-bar-fill" id="xpBarFill"></div>
            </div>
            <div class="xp-stats">
                <span id="xpCurrentText">0 / 100 XP</span>
                <span id="xpTotalText">累積魔法經驗：同步中...</span>
            </div>
        </div>

        <!-- 各科學習戰報 -->
        <div class="section-header">
            📊 萬聖各科學習戰報
        </div>
        <div class="subjects-grid">
            <!-- 英文科 -->
            <div class="subject-card">
                <div>
                    <div class="subject-header">
                        <span class="subject-title">🔤 萬聖單字魔法</span>
                        <span class="subject-xp" id="enXpDisplay">0 XP</span>
                    </div>
                    <div class="subject-desc" id="enDetailDisplay" style="margin-top: 0.4rem;">
                        今日答對：0 題
                    </div>
                </div>
                <a href="en.html" class="subject-link">前往練習 ➔</a>
            </div>

            <!-- 國文科 -->
            <div class="subject-card">
                <div>
                    <div class="subject-header">
                        <span class="subject-title">📖 國文文言文</span>
                        <span class="subject-xp" id="zhXpDisplay">0 XP</span>
                    </div>
                    <div class="subject-desc" id="zhDetailDisplay" style="margin-top: 0.4rem;">
                        狀態：已啟用
                    </div>
                </div>
                <a href="zh.html" class="subject-link">前往練習 ➔</a>
            </div>
        </div>

        <!-- 成就勳章區 -->
        <div class="section-header">
            🏆 萬聖節特別成就勳章
        </div>
        <div class="badges-grid" id="badgesContainer">
            <!-- 勳章會透過 JS 自動渲染 -->
        </div>

        <div class="footer-brand">
            🎃 beta cale study app (Halloween Edition)
        </div>
    </div>

    <!-- 載入 Firebase 與 Firestore -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyChKI6znPkXg-lAKilYx2ezDmmTUM6_f7s",
        authDomain: "cale-study-app-41b9b.firebaseapp.com",
        projectId: "cale-study-app-41b9b",
        storageBucket: "cale-study-app-41b9b.firebasestorage.app",
        messagingSenderId: "819450732167",
        appId: "1:819450732167:web:a727579df57eb9da33e222",
        measurementId: "G-GP1XCE9W5E"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function getLocalSubjectsXP() {
        let enXP = parseInt(localStorage.getItem("xp_en") || "0", 10);
        let zhXP = parseInt(localStorage.getItem("xp_zh") || "0", 10);

        const oldXP = parseInt(localStorage.getItem("userXP") || localStorage.getItem("xp") || "0", 10);
        if (enXP === 0 && zhXP === 0 && oldXP > 0) {
            enXP = oldXP;
        }

        return { enXP, zhXP };
    }

    async function loadXPPage() {
        if (localStorage.getItem("isLoggedIn") !== "true") {
            window.location.replace("login.html");
            return;
        }

        document.body.style.display = "flex";

        const currentUser = localStorage.getItem("currentUser") || "小幽靈";
        const userPicture = localStorage.getItem("userPicture");
        const accountKey = localStorage.getItem("accountKey") || localStorage.getItem("userEmail") || currentUser;
        
        document.getElementById("username").innerText = currentUser;

        if (userPicture) {
            document.getElementById("userAvatar").src = userPicture;
        }

        let { enXP, zhXP } = getLocalSubjectsXP();

        try {
            const rawDocRef = doc(db, "users", accountKey);
            let userSnap = await getDoc(rawDocRef);
            let targetRef = rawDocRef;

            if (!userSnap.exists()) {
                const safeDocId = accountKey.replace(/[^a-zA-Z0-9_-]/g, "_");
                const safeDocRef = doc(db, "users", safeDocId);
                userSnap = await getDoc(safeDocRef);
                if (userSnap.exists()) {
                    targetRef = safeDocRef;
                }
            }

            if (userSnap.exists()) {
                const data = userSnap.data();
                if (data.xp_en !== undefined) enXP = Math.max(enXP, data.xp_en);
                if (data.xp_zh !== undefined) zhXP = Math.max(zhXP, data.xp_zh);
            }

            const totalXP = enXP + zhXP;

            await setDoc(targetRef, { 
                xp_en: enXP, 
                xp_zh: zhXP, 
                xp: totalXP,
                totalXp: totalXP 
            }, { merge: true });

            localStorage.setItem("xp_en", enXP);
            localStorage.setItem("xp_zh", zhXP);
            localStorage.setItem("userXP", totalXP);
            localStorage.setItem("xp", totalXP);

            renderXPData(enXP, zhXP);

        } catch (error) {
            console.error("從 Firebase 獲取 XP 失敗，維持本機紀錄:", error);
            renderXPData(enXP, zhXP);
        }
    }

    function renderXPData(enXP, zhXP) {
        const totalXP = enXP + zhXP;

        const xpPerLevel = 100;
        const level = Math.floor(totalXP / xpPerLevel) + 1;
        const currentXP = totalXP % xpPerLevel;

        let title = "🎃 萬聖學徒";
        if (level >= 3) title = "👻 魔法單字使者";
        if (level >= 6) title = "🍬 糖果收藏家";
        if (level >= 10) title = "👑 萬聖學霸大魔王";

        document.getElementById("levelBadge").innerText = `Lv.${level}`;
        document.getElementById("userTitle").innerText = title;
        document.getElementById("xpCurrentText").innerText = `${currentXP} / ${xpPerLevel} XP`;
        document.getElementById("xpTotalText").innerText = `累積總魔法經驗：${totalXP} XP`;

        const percent = (currentXP / xpPerLevel) * 100;
        document.getElementById("xpBarFill").style.width = `${percent}%`;

        const todayCorrectCount = parseInt(localStorage.getItem("todayCorrectCount") || "0", 10);
        document.getElementById("enXpDisplay").innerText = `${enXP} XP`;
        document.getElementById("enDetailDisplay").innerText = `今日答對：${todayCorrectCount} 題`;

        document.getElementById("zhXpDisplay").innerText = `${zhXP} XP`;
        document.getElementById("zhDetailDisplay").innerText = `狀態：已與雲端同步`;

        const badges = [
            {
                icon: "🎃",
                name: "萬聖起步走",
                desc: "總成績達到第一個 10 XP",
                unlocked: totalXP >= 10
            },
            {
                icon: "👻",
                name: "萬聖單字使者",
                desc: "英文科獲得 50 XP 以上",
                unlocked: enXP >= 50
            },
            {
                icon: "📖",
                name: "古文魔法大師",
                desc: "國文科獲得 50 XP 以上",
                unlocked: zhXP >= 50
            },
            {
                icon: "🔥",
                name: "持之以恆的糖果",
                desc: "總成績達到 100 XP (升至 Lv.2)",
                unlocked: totalXP >= 100
            },
            {
                icon: "🦇",
                name: "雙科全能魔法師",
                desc: "英、國兩科皆獲得 100 XP 以上",
                unlocked: enXP >= 100 && zhXP >= 100
            },
            {
                icon: "👑",
                name: "萬聖學霸大魔王",
                desc: "總成績達到 1000 XP (升至 Lv.11)",
                unlocked: totalXP >= 1000
            }
        ];

        const badgesContainer = document.getElementById("badgesContainer");
        badgesContainer.innerHTML = "";

        badges.forEach(b => {
            const card = document.createElement("div");
            card.className = `badge-card ${b.unlocked ? 'unlocked' : 'locked'}`;
            card.innerHTML = `
                <div class="badge-icon">${b.icon}</div>
                <div class="badge-info">
                    <div class="badge-name">${b.name}</div>
                    <div class="badge-desc">${b.desc}</div>
                </div>
            `;
            badgesContainer.appendChild(card);
        });
    }

    loadXPPage();
</script>

</body>
</html>
